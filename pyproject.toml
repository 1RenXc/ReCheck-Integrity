[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recheck"
description = "Verify file integrity with SHA-256 and other hash algorithms, nmap-style CLI."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["sha256", "md5", "checksum", "hash", "integrity", "cli", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = []
dynamic = ["version"]

[project.scripts]
recheck = "recheck.cli:main"

[tool.setuptools]
packages = ["recheck"]

# recheck.__init__ is the single source of truth for the version number.
[tool.setuptools.dynamic]
version = { attr = "recheck.__version__" }
